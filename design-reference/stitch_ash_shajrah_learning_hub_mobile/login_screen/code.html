<!-- Micro-interactions Script -->
<script>
        document.getElementById('toggle-password').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                eyeIcon.textContent = 'visibility';
            }
        });

        // Add subtle focus effect to the card header
        const inputs = document.querySelectorAll('input');
        const header = document.querySelector('.bg-gradient-to-br');
        
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                header.style.transform = 'scale(1.01) translateY(-2px)';
                header.style.transition = 'all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
            });
            input.addEventListener('blur', () => {
                header.style.transform = 'scale(1) translateY(0)';
            });
        });
    </script>
