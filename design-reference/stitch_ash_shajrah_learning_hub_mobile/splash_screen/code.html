<script>
    // Simple micro-interaction for entry animation
    document.addEventListener('DOMContentLoaded', () => {
        const logo = document.getElementById('logo-container');
        const text = document.getElementById('text-container');
        
        // Trigger entry animations
        setTimeout(() => {
            if(logo) {
                logo.classList.remove('scale-95', 'opacity-0');
                logo.classList.add('scale-100', 'opacity-100');
            }
        }, 100);

        setTimeout(() => {
            if(text) {
                text.classList.remove('translate-y-8', 'opacity-0');
                text.classList.add('translate-y-0', 'opacity-100');
            }
        }, 400);

        // Optional: Continuous gentle hover effect for the logo
        if(logo) {
            let start = Date.now();
            function animate() {
                let elapsed = Date.now() - start;
                let y = Math.sin(elapsed / 1500) * 8;
                logo.style.transform = `translateY(${y}px)`;
                requestAnimationFrame(animate);
            }
            animate();
        }
    });

    // Handle potential click to skip or proceed (common splash pattern)
    document.body.addEventListener('click', () => {
        const main = document.querySelector('main');
        if(main) {
            main.style.transition = 'opacity 0.5s ease';
            main.style.opacity = '0';
            setTimeout(() => {

                console.log('Transitioning to Home...');
                main.style.opacity = '1';
            }, 500);
        }
    });
